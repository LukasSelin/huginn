name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The internal/git tests drive the git CLI. They set up their own
      # repositories, but a configured user keeps any git call that falls
      # back to the global identity from failing.
      - name: Configure git
        run: |
          git --version
          git config --global user.name "huginn CI"
          git config --global user.email "ci@huginn.invalid"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
